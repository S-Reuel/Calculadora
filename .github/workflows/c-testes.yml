name: Testes em C

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Instalar build-essential
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Compilar
      run: gcc $(ls src/*.c | grep -v main.c) tests/*.c -o tests

    - name: Rodar testes
      run: ./bin/tests/tests_exec
